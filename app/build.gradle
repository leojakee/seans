plugins {
    id 'com.android.application' version '8.13.2'
}

// Release signing: keystore.properties in the project root (git-ignored) or the SEANS_* environment
// variables in CI. Without them release builds stay unsigned and debug builds use the debug key.
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def signingValue = { String key, String env -> signing.getProperty(key) ?: System.getenv(env) }

android {
    namespace 'app.seans.cinema'
    compileSdk 35
    defaultConfig {
        applicationId 'app.seans.cinema'
        if (providers.gradleProperty('parallelInstall').isPresent()) {
            applicationIdSuffix '.home'
        }
        resValue 'string', 'app_name', providers.gradleProperty('parallelInstall').isPresent() ? 'Сеанс Кино' : 'Сеанс'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '2.0'
    }
    signingConfigs {
        release {
            def store = signingValue('storeFile', 'SEANS_KEYSTORE')
            if (store) {
                storeFile file(store)
                storePassword signingValue('storePassword', 'SEANS_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'SEANS_KEY_ALIAS') ?: 'seans'
                keyPassword signingValue('keyPassword', 'SEANS_KEY_PASSWORD') ?: signingValue('storePassword', 'SEANS_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingValue('storeFile', 'SEANS_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.tvprovider:tvprovider:1.0.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
